name: Regen Bundle (temp)
on:
  push:
    branches: [feat/memory-system-token-budget]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  regen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/memory-system-token-budget
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: node packages/omo-senpi/plugin/scripts/build-extension.mjs
      - name: Commit regenerated bundles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f packages/omo-senpi/plugin/extensions/*.js packages/omo-senpi/plugin/extensions/*.mjs
          git diff --staged --quiet || (git commit -m "build(omo-senpi): regenerate extension bundles on Linux CI" && git push)
