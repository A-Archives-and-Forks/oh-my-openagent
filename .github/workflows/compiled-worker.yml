name: Compiled session worker

on:
  pull_request:
    paths:
      - script/senpi-worker-compile.ts
      - script/senpi-worker-compile.test.ts
      - .github/workflows/compiled-worker.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  relocated-worker:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - name: Exercise relocated compiled workers without repository dependencies
        shell: bash
        run: |
          set -euo pipefail
          scratch=$(mktemp -d)
          trap 'rm -rf "$scratch"' EXIT
          cp script/senpi-worker-compile.ts script/senpi-worker-compile.test.ts "$scratch/"
          cd "$scratch"
          bun --revision
          bun test
